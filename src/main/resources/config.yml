mongodb:
  uri: "mongodb://localhost:27017"
  database: "autoplant"
  collection: "player_counts"
sync:
  period-ticks: 1200
replant:
  delay-ticks: 20
# 심어진 작물 블럭 -> 재심기에 필요한(소모할) 씨앗 아이템
crops:
  WHEAT: WHEAT_SEEDS
  CARROTS: CARROT
  POTATOES: POTATO
  BEETROOTS: BEETROOT_SEEDS
  NETHER_WART: NETHER_WART
  PUMPKIN_STEM: PUMPKIN_SEEDS
  ATTACHED_PUMPKIN_STEM: PUMPKIN_SEEDS
  MELON_STEM: MELON_SEEDS
  ATTACHED_MELON_STEM: MELON_SEEDS
  COCOA: COCOA_BEANS
# 부착 줄기(다 자란 상태)를 부수면 성장 줄기로 되돌려 심는다
stems:
  ATTACHED_PUMPKIN_STEM: PUMPKIN_STEM
  ATTACHED_MELON_STEM: MELON_STEM
# CustomCrops(Xiao-MoMi) 연동: 다 자란 커스텀 작물 수확 시 씨앗 소모 후 재심기
# (CustomCrops 플러그인이 설치돼 있어야 동작한다)
custom-crops:
  enabled: true
